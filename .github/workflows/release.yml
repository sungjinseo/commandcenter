name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      packages: write # the image on ghcr.io
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/commandcenter
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest. A prerelease (v1.2.3-rc.1) gets
          # only its own tag; a v0.x release gets no "0".
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          # GitHub detects only the Apache license file.
          labels: org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Package the binaries
        # The same build again, served from the builder's cache and exported as
        # files: the binaries are the image's, with the license texts the BSD and
        # MIT licenses of the linked code ask a binary distribution to carry.
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" --output type=local,dest=out .
          mkdir dist
          for arch in amd64 arm64; do
            name="commandcenter-$VERSION-linux-$arch"
            mkdir "$name"
            cp "out/linux_$arch/usr/local/bin/commandcenter" "out/linux_$arch/usr/share/doc/commandcenter/"* "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --verify-tag --generate-notes --prerelease=${{ contains(github.ref_name, '-') }}
