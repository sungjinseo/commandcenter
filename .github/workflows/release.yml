name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      packages: write # the image on ghcr.io
      id-token: write # the OIDC token cosign signs the image with
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, for the floating step
          persist-credentials: false
      - id: floating
        # A floating tag (latest, 1, 1.2) moves only to the highest release in its
        # range: v1.2.5 after v1.3.0 gets 1.2.5 and 1.2, while 1 and latest stay
        # on 1.3.0. Prereleases never count and never move one.
        run: |
          highest() { # highest <prefix>: is $VERSION the highest release tag starting with <prefix>?
            if [ "$(git tag -l "$1*" --sort=v:refname | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | tail -n1)" = "$VERSION" ]; then echo true; else echo false; fi
          }
          IFS=. read -r major minor _ <<<"$VERSION"
          {
            echo "latest=$(highest v)"
            echo "major=$(highest "$major.")"
            echo "minor=$(highest "$major.$minor.")"
          } >>"$GITHUB_OUTPUT"
      # No v4 major tag exists (v3 stopped at v3.9.1), so the release is pinned;
      # Dependabot moves it. Installed before the push: a failed install stops
      # the release before anything is published.
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/commandcenter
          # v1.2.3 -> 1.2.3, plus 1.2, 1 and latest where the floating step allows.
          # A prerelease (v1.2.3-rc.1) gets only its own tag; a v0.x release gets no "0".
          flavor: latest=${{ steps.floating.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.floating.outputs.minor }}
            type=semver,pattern={{major}},enable=${{ steps.floating.outputs.major == 'true' && !startsWith(github.ref, 'refs/tags/v0.') }}
          # GitHub detects only the Apache license file.
          labels: org.opencontainers.image.licenses=MIT OR Apache-2.0
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Sign the image
        # Keyless: Sigstore's certificate names this workflow at the release tag,
        # and the signature goes to its public transparency log. The digest is
        # the multi-platform index, which every tag of this release points to.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/commandcenter@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Package the binaries
        # The same build again, served from the builder's cache and exported as
        # files: the binaries are the image's, with the license texts the BSD and
        # MIT licenses of the linked code ask a binary distribution to carry.
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" --output type=local,dest=out .
          mkdir dist
          for arch in amd64 arm64; do
            name="commandcenter-$VERSION-linux-$arch"
            mkdir "$name"
            cp "out/linux_$arch/usr/local/bin/commandcenter" "out/linux_$arch/usr/share/doc/commandcenter/"* "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --verify-tag --generate-notes --prerelease=${{ contains(github.ref_name, '-') }} --latest=${{ steps.floating.outputs.latest }}
