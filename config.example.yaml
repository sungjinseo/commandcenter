# commandcenter 설정 예시. config.yaml로 복사한 뒤 사용자 비밀번호 해시를 채우세요.
listen: ":8081"
baseURL: "http://localhost:8081"   # 클라이언트가 접속하는 주소
dataDir: "/data"
# backupDir: "/backup"            # 온라인 백업 위치(프로세스 설정). 기본 /backup, docker-compose가 ./backup을 마운트
memoryLimitMiB: 80
# secretKeyFile: /run/secrets/commandcenter-secret-key  # 저장된 비밀값(SMTP·LDAP·remoteAuth)을 암호화하는 키 파일. 만들기: head -c 32 /dev/urandom | base64
# maxUploadMiB: 1024               # 업로드 본문 최대 크기(MiB). 기본 1024, 1..1048576. 초과하면 413
anonymousRead: true                # 익명 다운로드 허용 (저장소별 anonymousRead로 덮어쓰기 가능)

users:
  - name: admin
    passwordHash: "<commandcenter hash-password 출력값>"
    roles: [admin]
  - name: ci
    passwordHash: "<commandcenter hash-password 출력값>"
    roles: [deployer]

roles:
  deployer: { write: ["maven-releases", "maven-snapshots", "npm-hosted", "pypi-hosted", "go-hosted", "cargo-hosted", "docker-hosted"] }

repositories:
  - name: maven-central
    format: maven
    type: proxy
    remote: "https://repo1.maven.org/maven2/"
    metadataMaxAge: "24h"
  - name: maven-releases
    format: maven
    type: hosted
    versionPolicy: release
    writePolicy: allow_once
  - name: maven-snapshots
    format: maven
    type: hosted
    versionPolicy: snapshot
    writePolicy: allow
  - name: maven-public
    format: maven
    type: group
    members: [maven-releases, maven-snapshots, maven-central]
  - name: npm-proxy
    format: npm
    type: proxy
    remote: "https://registry.npmjs.org/"
    metadataMaxAge: "1h"
  - name: npm-hosted
    format: npm
    type: hosted
  - name: npm-all
    format: npm
    type: group
    members: [npm-hosted, npm-proxy]
    writeMember: npm-hosted
  - name: pypi-proxy
    format: pypi
    type: proxy
    remote: "https://pypi.org/"
    metadataMaxAge: "1h"
  - name: pypi-hosted
    format: pypi
    type: hosted
  - name: pypi-all
    format: pypi
    type: group
    members: [pypi-hosted, pypi-proxy]
    writeMember: pypi-hosted
  - name: go-proxy
    format: go
    type: proxy
    remote: "https://proxy.golang.org/"
    metadataMaxAge: "1h"
  - name: go-hosted
    format: go
    type: hosted
  - name: go-all
    format: go
    type: group
    members: [go-hosted, go-proxy]
    writeMember: go-hosted
  - name: cargo-proxy
    format: cargo
    type: proxy
    remote: "https://index.crates.io/"
    metadataMaxAge: "1h"
  - name: cargo-hosted
    format: cargo
    type: hosted
  - name: cargo-all
    format: cargo
    type: group
    members: [cargo-hosted, cargo-proxy]
    writeMember: cargo-hosted
  - name: docker-hosted               # docker push <host>/docker-hosted/<image>:<tag> (API: /v2/docker-hosted/<image>/...)
    format: docker
    type: hosted
    writePolicy: allow                # allow_once: 이미 있는 태그를 다른 이미지로 덮어쓰지 못함
  - name: docker-proxy                # docker pull <host>/docker-proxy/nginx:1.27 (Docker Hub의 library/nginx)
    format: docker
    type: proxy
    remote: "https://registry-1.docker.io"   # 레지스트리 주소(/v2 없이). 비공개 이미지나 Hub 한도 완화: remoteAuth 사용자/비밀번호(액세스 토큰)
    metadataMaxAge: "24h"             # 태그 → 매니페스트 재검증 주기. digest로 받은 매니페스트와 blob은 영구 캐시
  - name: docker-all                  # docker pull <host>/docker-all/<image>:<tag> — hosted 먼저, 없으면 proxy
    format: docker
    type: group
    members: [docker-hosted, docker-proxy]
