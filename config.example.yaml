# commandcenter 설정 예시. config.yaml로 복사한 뒤 사용자 비밀번호 해시를 채우세요.
listen: ":8081"
baseURL: "http://localhost:8081"   # 클라이언트가 접속하는 주소
dataDir: "/data"
memoryLimitMiB: 80
# secretKeyFile: /run/secrets/commandcenter-secret-key  # 저장된 비밀값(SMTP·LDAP·remoteAuth, S3 store의 secretAccessKey)을 암호화하는 키 파일. 만들기: head -c 32 /dev/urandom | base64
# Blob store는 Blob Store 화면(POST /-/api/blobstores)에서 만듭니다. S3 store의 accessKeyId/secretAccessKey를 비우면
# 프로세스 환경의 AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY(, AWS_SESSION_TOKEN)를 씁니다.
# maxUploadMiB: 1024               # 업로드 본문 최대 크기(MiB). 기본 1024, 1..1048576. 초과하면 413
anonymousRead: true                # 익명 다운로드 허용 (저장소별 anonymousRead로 덮어쓰기 가능)

users:
  - name: admin
    passwordHash: "<commandcenter hash-password 출력값>"
    roles: [admin]
  - name: ci
    passwordHash: "<commandcenter hash-password 출력값>"
    roles: [deployer]

roles:
  deployer: { write: ["maven-releases", "maven-snapshots", "npm-hosted", "pypi-hosted", "go-hosted", "cargo-hosted", "docker-hosted", "raw-hosted", "helm-hosted", "nuget-hosted", "yum-hosted", "apt-hosted", "gems-hosted", "composer-hosted", "conda-hosted", "conan-hosted", "r-hosted", "lfs-hosted"] }

# 라우팅 규칙: proxy가 원격에 물어볼 수 있는 경로. RE2 정규식, 요청 경로 앞에 "/"가 붙습니다. 첫 시작 때만 가져옵니다.
# routingRules:
#   - name: no-internal
#     description: 사내 그룹과 SNAPSHOT은 원격에 묻지 않음
#     mode: BLOCK                      # BLOCK | ALLOW
#     matchers: ["^/com/mycompany/", ".*-SNAPSHOT.*"]
# 컨텐츠 셀렉터: 역할 권한의 selector:<이름> 대상이 가리키는 경로 식. 첫 시작 때만 가져옵니다.
# contentSelectors:
#   - name: acme
#     description: acme 팀 아티팩트
#     expression: 'format == "maven2" and path =^ "/org/acme/"'

repositories:
  - name: maven-central
    format: maven
    type: proxy
    remote: "https://repo1.maven.org/maven2/"
    metadataMaxAge: "24h"
    # routingRule: no-internal          # 이 proxy에 적용할 라우팅 규칙 이름(없으면 모두 통과)
  - name: maven-releases
    format: maven
    type: hosted
    versionPolicy: release
    writePolicy: allow_once
  - name: maven-snapshots
    format: maven
    type: hosted
    versionPolicy: snapshot
    writePolicy: allow
  - name: maven-public
    format: maven
    type: group
    members: [maven-releases, maven-snapshots, maven-central]
  - name: npm-proxy
    format: npm
    type: proxy
    remote: "https://registry.npmjs.org/"
    metadataMaxAge: "1h"
  - name: npm-hosted
    format: npm
    type: hosted
  - name: npm-all
    format: npm
    type: group
    members: [npm-hosted, npm-proxy]
    writeMember: npm-hosted
  - name: pypi-proxy
    format: pypi
    type: proxy
    remote: "https://pypi.org/"
    metadataMaxAge: "1h"
  - name: pypi-hosted
    format: pypi
    type: hosted
  - name: pypi-all
    format: pypi
    type: group
    members: [pypi-hosted, pypi-proxy]
    writeMember: pypi-hosted
  - name: go-proxy
    format: go
    type: proxy
    remote: "https://proxy.golang.org/"
    metadataMaxAge: "1h"
  - name: go-hosted
    format: go
    type: hosted
  - name: go-all
    format: go
    type: group
    members: [go-hosted, go-proxy]
    writeMember: go-hosted
  - name: cargo-proxy
    format: cargo
    type: proxy
    remote: "https://index.crates.io/"
    metadataMaxAge: "1h"
  - name: cargo-hosted
    format: cargo
    type: hosted
  - name: cargo-all
    format: cargo
    type: group
    members: [cargo-hosted, cargo-proxy]
    writeMember: cargo-hosted
  - name: docker-hosted               # docker push <host>/docker-hosted/<image>:<tag> (API: /v2/docker-hosted/<image>/...)
    format: docker
    type: hosted
    writePolicy: allow                # allow_once: 이미 있는 태그를 다른 이미지로 덮어쓰지 못함
  - name: docker-proxy                # docker pull <host>/docker-proxy/nginx:1.27 (Docker Hub의 library/nginx)
    format: docker
    type: proxy
    remote: "https://registry-1.docker.io"   # 레지스트리 주소(/v2 없이). 비공개 이미지나 Hub 한도 완화: remoteAuth 사용자/비밀번호(액세스 토큰)
    metadataMaxAge: "24h"             # 태그 → 매니페스트 재검증 주기. digest로 받은 매니페스트와 blob은 영구 캐시
  - name: docker-all                  # docker pull <host>/docker-all/<image>:<tag> — hosted 먼저, 없으면 proxy
    format: docker
    type: group
    members: [docker-hosted, docker-proxy]
  - name: raw-hosted                  # curl -u ci:PW -T file.bin http://<host>/repository/raw-hosted/any/path/file.bin
    format: raw
    type: hosted
    writePolicy: allow_once           # allow: 덮어쓰기 허용(edit 권한 필요). 디렉터리 목록: GET …/raw-hosted/any/path/
  - name: raw-proxy                   # 원격 웹 사이트의 파일을 경로 그대로 캐시 (HTML도 파일로 캐시)
    format: raw
    type: proxy
    remote: "https://downloads.example.com/"
    contentMaxAge: "-1"               # 영구 캐시. 원격 404는 negativeCacheTTL 동안 기억
  - name: raw-all                     # hosted 먼저, 없으면 proxy; 업로드는 raw-hosted로
    format: raw
    type: group
    members: [raw-hosted, raw-proxy]
    writeMember: raw-hosted
  - name: helm-hosted                 # curl -u ci:pw --upload-file demo-1.0.0.tgz <host>/repository/helm-hosted/  또는 helm cm-push
    format: helm
    type: hosted
    writePolicy: allow_once           # allow: 같은 버전 덮어쓰기 허용(edit 권한)
  - name: helm-proxy                  # helm repo add bitnami <host>/repository/helm-proxy
    format: helm
    type: proxy
    remote: "https://charts.bitnami.com/bitnami/"   # index.yaml이 있는 차트 저장소 URL
    metadataMaxAge: "1h"              # index.yaml 재확인 주기. 차트 파일은 digest로 검증 후 영구 캐시
  - name: helm-all                    # helm repo add cc <host>/repository/helm-all — hosted가 가진 차트 이름은 hosted 버전만
    format: helm
    type: group
    members: [helm-hosted, helm-proxy]
    writeMember: helm-hosted
  - name: nuget-hosted                # dotnet nuget push x.nupkg -s <host>/repository/nuget-hosted/index.json -k <API 토큰>
    format: nuget
    type: hosted
    writePolicy: allow_once           # allow: 같은 버전 덮어쓰기 허용(edit 권한)
  - name: nuget-proxy                 # dotnet nuget add source <host>/repository/nuget-proxy/index.json
    format: nuget
    type: proxy
    remote: "https://api.nuget.org/v3/index.json"   # V3 서비스 인덱스 URL
    metadataMaxAge: "1h"              # 서비스 인덱스·버전 목록·registration·검색 재확인 주기. .nupkg는 영구 캐시
  - name: nuget-all                   # dotnet nuget add source <host>/repository/nuget-all/index.json — hosted가 가진 id는 hosted 버전만
    format: nuget
    type: group
    members: [nuget-hosted, nuget-proxy]
    writeMember: nuget-hosted
  - name: yum-hosted                  # curl -u ci:pw --upload-file demo-1.0-1.el9.x86_64.rpm <host>/repository/yum-hosted/el9/
    format: yum
    type: hosted
    writePolicy: allow_once           # allow: 같은 패키지 덮어쓰기 허용(edit 권한)
    depth: 1                          # repodata/ 위치: 0 = 저장소 루트 하나(기본), 1 = 첫 디렉터리마다(el8/, el9/ ...)
  - name: yum-proxy                   # baseurl=<host>/repository/yum-proxy/rocky/9/BaseOS/x86_64/os/
    format: yum
    type: proxy
    remote: "https://dl.rockylinux.org/pub/"   # 미러의 루트. 경로를 그대로 캐시
    metadataMaxAge: "1h"              # repodata/ 재확인 주기. rpm 파일은 영구 캐시
  - name: yum-all                     # baseurl=<host>/repository/yum-all/… — 경로를 먼저 가진 멤버가 답함(병합 없음)
    format: yum
    type: group
    members: [yum-hosted, yum-proxy]
    writeMember: yum-hosted
  - name: apt-hosted                  # curl -u ci:pw -T hello_1.0_amd64.deb <host>/repository/apt-hosted/pool/hello_1.0_amd64.deb
    format: apt
    type: hosted
    writePolicy: allow_once           # allow: 같은 패키지_버전_아키텍처 덮어쓰기 허용(edit 권한)
    distribution: stable              # dists/<distribution>/ (기본 stable). sources.list의 suite
    component: main                   # 기본 main. 패키지는 pool/<component>/… 에 저장
    # signingKey: |                   # 비밀번호 없는 RSA OpenPGP 개인키(ASCII armor). 있으면 Release.gpg·InRelease 서명, 공개키는 …/public.key
    #   -----BEGIN PGP PRIVATE KEY BLOCK-----
    #   ...
  - name: apt-proxy                   # deb http://<host>/repository/apt-proxy bookworm main
    format: apt
    type: proxy
    remote: "https://deb.debian.org/debian/"   # dists/와 pool/이 있는 원격 저장소 URL. 서명은 원격 것을 그대로 전달
    metadataMaxAge: "1h"              # dists/ 재확인 주기. pool/의 .deb는 영구 캐시
  - name: apt-all                     # hosted 먼저, 없으면 proxy (경로 단위; Packages를 합치지는 않음)
    format: apt
    type: group
    members: [apt-hosted, apt-proxy]
    writeMember: apt-hosted
  - name: gems-hosted                 # gem push demo-1.0.0.gem --host <host>/repository/gems-hosted --key cc  (~/.gem/credentials 의 :cc: 에 API 토큰)
    format: rubygems
    type: hosted
    writePolicy: allow_once
  - name: gems-proxy                  # gem sources --add <host>/repository/gems-proxy/
    format: rubygems
    type: proxy
    remote: "https://rubygems.org/"   # 루트 URL (compact index · gems/ · quick/ 가 그 아래)
  - name: gems-all                    # bundle config mirror.https://rubygems.org <host>/repository/gems-all/ — versions·names 병합, 같은 이름은 앞 멤버가 답
    format: rubygems
    type: group
    members: [gems-hosted, gems-proxy]
    writeMember: gems-hosted
  - name: composer-hosted              # curl -u ci:pw -T demo-1.2.0.zip <host>/repository/composer-hosted/packages/upload/acme/demo/1.2.0
    format: composer
    type: hosted
    writePolicy: allow_once           # allow: 같은 버전 덮어쓰기 허용(edit 권한)
  - name: composer-proxy               # composer config repositories.cc composer <host>/repository/composer-proxy/
    format: composer
    type: proxy
    remote: "https://repo.packagist.org/"   # Composer v2 저장소 루트(Satis, Private Packagist도 가능)
    metadataMaxAge: "1h"              # packages.json·패키지 메타데이터·검색 재확인 주기. zip은 영구 캐시
  - name: composer-all                 # composer config repositories.cc composer <host>/repository/composer-all/ — hosted가 가진 패키지는 hosted 버전만
    format: composer
    type: group
    members: [composer-hosted, composer-proxy]
    writeMember: composer-hosted
  - name: conda-hosted                # curl -u ci:pw --upload-file foo-1.0-py_0.tar.bz2 <host>/repository/conda-hosted/noarch/
    format: conda
    type: hosted
    writePolicy: allow_once           # allow: 같은 파일 덮어쓰기 허용(edit 권한). .conda는 이름·버전·빌드·해시만 기록(의존성 없음)
  - name: conda-proxy                 # conda config --add channels <host>/repository/conda-proxy
    format: conda
    type: proxy
    remote: "https://conda.anaconda.org/conda-forge/"   # 채널 URL. 경로를 그대로 캐시
    metadataMaxAge: "1h"              # repodata.json·channeldata.json 재확인 주기. 패키지는 영구 캐시
  - name: conda-all                   # repodata.json·channeldata.json은 멤버 것을 합쳐서 답함(hosted 먼저)
    format: conda
    type: group
    members: [conda-hosted, conda-proxy]
    writeMember: conda-hosted
  - name: conan-hosted                # conan upload "pkg/*" -r cc --confirm  (conan remote add cc <host>/repository/conan-hosted)
    format: conan
    type: hosted
    writePolicy: allow_once           # 새 리비전은 언제나 허용. allow: 같은 리비전 파일 덮어쓰기 허용(edit 권한)
  - name: conan-proxy                 # conan remote add cc <host>/repository/conan-proxy
    format: conan
    type: proxy
    remote: "https://center.conan.io/"   # Conan 서버 루트(v2 API). remoteAuth가 있으면 원격에 로그인해 토큰 사용
    metadataMaxAge: "1h"              # latest/revisions/files 목록·검색 재확인 주기. 파일은 영구 캐시
  - name: conan-all                   # conan remote add cc <host>/repository/conan-all — hosted가 가진 레시피는 hosted 리비전만
    format: conan
    type: group
    members: [conan-hosted, conan-proxy]
    writeMember: conan-hosted
  - name: r-hosted                    # curl -u ci:pw --upload-file foo_1.0.0.tar.gz <host>/repository/r-hosted/src/contrib/
    format: r
    type: hosted
    writePolicy: allow_once           # allow: 같은 디렉터리의 같은 패키지_버전 덮어쓰기 허용(edit 권한)
  - name: r-proxy                     # options(repos = c(CRAN = "<host>/repository/r-proxy"))
    format: r
    type: proxy
    remote: "https://cloud.r-project.org/"   # CRAN 미러 또는 Posit Package Manager(https://packagemanager.posit.co/cran/latest/). 경로를 그대로 캐시
    metadataMaxAge: "1h"              # PACKAGES*·Meta/ 재확인 주기. 패키지 파일은 영구 캐시
  - name: r-all                       # options(repos = c(CC = "<host>/repository/r-all")) — 파일은 먼저 가진 멤버, PACKAGES는 병합
    format: r
    type: group
    members: [r-hosted, r-proxy]
    writeMember: r-hosted
  - name: lfs-hosted                  # git config -f .lfsconfig lfs.url http://<host>/repository/lfs-hosted/info/lfs
    format: gitlfs                    # hosted만 지원(proxy/group 불가). 오브젝트 크기는 maxUploadMiB 이하
    type: hosted
    writePolicy: allow_once           # 같은 oid 재업로드는 멱등(200). deny: 읽기 전용

# database:
#   url: postgres://cc:password@db.example:5432/commandcenter?sslmode=require
#   # To move an existing SQLite meta.db here, stop the server and run
#   #   commandcenter migrate-db -config /etc/commandcenter/config.yaml -to 'postgres://...'
#   # with the config still naming the SQLite database, then set url and start with the same secret key.
