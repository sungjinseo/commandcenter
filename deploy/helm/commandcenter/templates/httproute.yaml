{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs is required: the Gateway the route attaches to" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "commandcenter.fullname" . }}
  labels:
    {{- include "commandcenter.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "commandcenter.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
{{- if and .Values.s3.enabled .Values.s3.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs is required for s3.httpRoute: the Gateway the route attaches to" }}
{{- end }}
{{- if not .Values.s3.httpRoute.hostnames }}
{{- fail "s3.httpRoute.hostnames is required: S3 clients need a host name of their own" }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "commandcenter.fullname" . }}-s3
  labels:
    {{- include "commandcenter.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.s3.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "commandcenter.fullname" . }}
          port: {{ .Values.s3.port }}
{{- end }}
