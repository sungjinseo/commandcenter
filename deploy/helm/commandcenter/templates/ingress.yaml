{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "commandcenter.fullname" . }}
  labels:
    {{- include "commandcenter.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "commandcenter.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
    {{- if and .Values.s3.enabled .Values.s3.host }}
    {{- range $h := (ternary (list .Values.s3.host (printf "*.%s" .Values.s3.host)) (list .Values.s3.host) .Values.s3.virtualHost) }}
    - host: {{ $h | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "commandcenter.fullname" $ }}
                port:
                  name: http
    {{- end }}
    {{- end }}
{{- end }}
