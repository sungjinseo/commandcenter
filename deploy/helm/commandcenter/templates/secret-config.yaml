{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "commandcenter.configSecret" . }}
  labels:
    {{- include "commandcenter.labels" . | nindent 4 }}
type: Opaque
data:
  # The admin password hash is in here, so the file is a Secret, not a ConfigMap.
  config.yaml: {{ include "commandcenter.configYAML" . | b64enc }}
{{- end }}
