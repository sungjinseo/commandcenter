{{- include "commandcenter.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "commandcenter.fullname" . }}
  labels:
    {{- include "commandcenter.labels" . | nindent 4 }}
spec:
  # Always 1: all locking is in-process, and a second pod would get its own empty volume. A
  # StatefulSet stops the old pod before it starts the new one, so two processes never open
  # meta.db at the same time; a Deployment's rolling update could.
  replicas: 1
  # With OrderedReady (the default) a pod that never gets ready, after a bad image tag or config,
  # blocks every later rollout, helm rollback included, until someone deletes it by hand. With one
  # replica there is no order to keep, and the pod's fixed name still means one pod at a time.
  # Immutable, like serviceName, selector and volumeClaimTemplates.
  podManagementPolicy: Parallel
  serviceName: {{ include "commandcenter.fullname" . }}
  selector:
    matchLabels:
      {{- include "commandcenter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "commandcenter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or (not .Values.config.existingSecret) .Values.podAnnotations }}
      annotations:
        {{- if not .Values.config.existingSecret }}
        # Only the keys read on every start: the imported ones are ignored after the first start.
        checksum/config: {{ include "commandcenter.configChecksum" . }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "commandcenter.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: commandcenter
          image: {{ include "commandcenter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            {{- with .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.proxy.http }}
            - name: HTTP_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.proxy.https }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secretKey.existingSecret }}
            - name: COMMANDCENTER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretKey.existingSecret }}
                  key: {{ .Values.secretKey.key }}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: COMMANDCENTER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/commandcenter
              readOnly: true
            # SQLite's temporary files; the root filesystem is read-only. Never a blob store.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- with .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
        - name: config
          secret:
            secretName: {{ include "commandcenter.configSecret" . }}
            items:
              - key: config.yaml
                path: config.yaml
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if not .Values.persistence.existingClaim }}
  # Fixed at install: changing persistence.* later fails the upgrade (README.md, "Resizing the
  # volume"). The claim outlives the release.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "commandcenter.selectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ if eq "-" . }}""{{ else }}{{ . }}{{ end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
