{{- if not (include "commandcenter.ha" .) }}
{{- include "commandcenter.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "commandcenter.fullname" . }}
  labels:
    {{- include "commandcenter.labels" . | nindent 4 }}
spec:
  # replicaCount 1: a second pod would get its own empty volume. A StatefulSet stops the old pod
  # before it starts the new one, so two processes never open meta.db at the same time; a
  # Deployment's rolling update could. More pods (PostgreSQL, ReadWriteMany) are deployment.yaml.
  replicas: 1
  # With OrderedReady (the default) a pod that never gets ready, after a bad image tag or config,
  # blocks every later rollout, helm rollback included, until someone deletes it by hand. With one
  # replica there is no order to keep, and the pod's fixed name still means one pod at a time.
  # Immutable, like serviceName, selector and volumeClaimTemplates.
  podManagementPolicy: Parallel
  serviceName: {{ include "commandcenter.fullname" . }}
  selector:
    matchLabels:
      {{- include "commandcenter.selectorLabels" . | nindent 6 }}
  {{- include "commandcenter.podTemplate" . | nindent 2 }}
  {{- if not .Values.persistence.existingClaim }}
  # Fixed at install: changing persistence.* later fails the upgrade (README.md, "Resizing the
  # volume"). The claim outlives the release.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "commandcenter.selectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ if eq "-" . }}""{{ else }}{{ . }}{{ end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
{{- end }}
