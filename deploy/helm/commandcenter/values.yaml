# Command Center chart. Read README.md (next to this file) and "Kubernetes" in docs/guide.md first.
#
# One pod by default: a StatefulSet with its own volume, beside a bundled single-pod PostgreSQL
# (postgresql) that holds the metadata. replicaCount above 1 runs the pods active-active (high
# availability) and needs a ReadWriteMany volume (persistence). values.schema.json rejects unknown
# keys.

# 1 renders the single-pod StatefulSet. Above 1: a Deployment (rolling updates start a new pod
# before they stop an old one), one shared ReadWriteMany claim, a PodDisruptionBudget of one pod
# and, unless affinity is set, pods preferably on different nodes. Every pod needs the same config
# and secret key; the nodes' clocks must be in sync (NTP). Going from 1 to more is a maintenance
# window: README.md, "High availability".
replicaCount: 1

image:
  repository: ghcr.io/sungjinseo/commandcenter
  # Defaults to the chart's appVersion. Pin a version; never use latest. Quote it ("1.10").
  tag: ""
  # Optional sha256:... digest, for example the one cosign verified. The tag stays for readability.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
# Set these before the first install only: a new name is a new StatefulSet with a new, empty volume.
nameOverride: ""
fullnameOverride: ""

# config.yaml at /etc/commandcenter/config.yaml. baseURL, anonymousRead, the users
# (adminPasswordHash), roles, maxUploadMiB and repositories are imported into the database on the first
# start only: change them in the web UI afterwards. The other keys are read on every start, and
# only a change to those restarts the pod.
config:
  # A Secret holding the whole file under the key config.yaml, which you then keep up to date and
  # restart the pod for. The other config values must stay empty. If its config.yaml has a
  # database.url, set postgresql.enabled to false: the server refuses a second URL.
  existingSecret: ""
  # The address clients use, https when TLS ends at the ingress. Required.
  baseURL: ""
  # Reading needs a sign-in unless this is true (repositories can override it).
  anonymousRead: false
  # bcrypt hash of the admin password: docker run --rm -i <image> hash-password. Required unless
  # extra.users is set. Single-quote it on a command line: the shell eats "$2a$10$...".
  adminPasswordHash: ""
  # Repositories created on the first start, in the format of config.example.yaml.
  repositories: []
  # Other keys of config.yaml: users (replaces the admin user above), roles, maxUploadMiB,
  # metricsFlushSeconds, secretKeyFile. listen and dataDir belong to the chart; memoryLimitMiB is
  # goMemLimit below; the database URL is database or postgresql below.
  extra: {}

# Encrypts the stored SMTP password, LDAP bind password and proxy remoteAuth credentials
# (guide: "저장된 비밀값 암호화"). Keep the key apart from the volume's backups, and never remove or
# replace it without "commandcenter secret-key rotate":
#   kubectl create secret generic commandcenter-secret-key --from-literal=key="$(head -c 32 /dev/urandom | base64)"
secretKey:
  existingSecret: ""
  key: key

# Metadata database: PostgreSQL 13 or newer, required. Empty existingSecret uses the bundled one
# (postgresql below). For an external server or a managed service, put the URL in a Secret (it
# carries the password):
#   kubectl create secret generic commandcenter-database \
#     --from-literal=url='postgres://cc:PASSWORD@db:5432/commandcenter?sslmode=require'
# The database must exist, owned by the URL's role; tables are created on the first start.
database:
  existingSecret: ""
  key: url
  # Pool size per pod; 0 leaves the server's default (10).
  maxConns: 0

# The bundled PostgreSQL, used while database.existingSecret is empty: one pod (a StatefulSet
# <fullname>-postgresql) with a volume of its own, and a password generated on install and kept
# across upgrades in the Secret <fullname>-postgresql (key password; key url is the server's URL).
# It is one pod, not highly available, and its volume outlives the release like the server's: for
# production, and for replicaCount above 1, prefer a replicated PostgreSQL (database.existingSecret).
# Back it up with pg_dump (docs/guide.md).
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    digest: ""
    pullPolicy: IfNotPresent
  database: commandcenter
  username: commandcenter
  # The image's postgres user (uid 70 on Alpine). OpenShift's restricted-v2 SCC assigns the user
  # and groups itself: set runAsUser, runAsGroup and fsGroup to null there.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    # Block storage (a cloud disk, iSCSI, a local volume), never NFS or SMB. Empty uses the
    # cluster's default StorageClass; "-" sets storageClassName "". Fixed at install.
    storageClass: ""
    size: 8Gi
    accessModes: [ReadWriteOnce]
    annotations: {}

# Go's soft memory limit (GOMEMLIMIT). Keep it about 60-65 % of resources.limits.memory, and raise
# both together. "" leaves it to memoryLimitMiB in an existingSecret's config.yaml.
goMemLimit: 80MiB

# For proxy repositories that reach the internet through a forward proxy. Put in-cluster remotes
# in noProxy (".svc,.cluster.local"), or they go through the proxy too.
proxy:
  http: ""
  https: ""
  noProxy: ""

extraEnv: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    # No CPU limit: bcrypt and upload hashing come in bursts, and throttling them only makes
    # sign-ins and uploads slow.
    memory: 128Mi

persistence:
  # Block storage or a network file system (NFS, ...). With replicaCount above 1, a ReadWriteMany
  # class (NFS, CephFS, EFS, ...) that every pod mounts. Empty uses the cluster's default
  # StorageClass; "-" sets storageClassName "" (pre-bound volumes).
  storageClass: ""
  # The default blob store and every store's temp and upload session files.
  # Proxy caches grow until cleanup policies remove them. storageClass, size, accessModes and
  # annotations are fixed at install: README.md says how to resize.
  size: 50Gi
  # ReadWriteOnce, ReadWriteOncePod or ReadWriteMany with one pod; ReadWriteMany with more.
  accessModes: [ReadWriteOnce]
  # On the claim; with replicaCount above 1 the chart adds helm.sh/resource-policy: keep, so an
  # uninstall leaves the shared claim, as it leaves the StatefulSet's.
  annotations: {}
  # A PVC you made, such as a restored snapshot or, with replicaCount above 1, a ReadWriteMany
  # claim holding the blobs copied from the single pod's volume. It replaces the claim above, whose
  # settings are then not used.
  existingClaim: ""

service:
  type: ClusterIP
  port: 8081
  annotations: {}

# TLS ends here; set config.baseURL to the https address. Uploads need a body limit of at least
# maxUploadMiB (1024 MiB by default) and long timeouts, for example with ingress-nginx:
#   nginx.ingress.kubernetes.io/proxy-body-size: "0"   # the server enforces maxUploadMiB
#   nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
#   nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
#   nginx.ingress.kubernetes.io/proxy-request-buffering: "off" # not on the shared controller's disk
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: repo.example.com
      paths: [/]
  tls: []
  #  - secretName: repo-example-com-tls
  #    hosts: [repo.example.com]

# A Gateway API HTTPRoute, for clusters that publish services through a Gateway (Traefik,
# Istio, Envoy Gateway, ...) instead of an Ingress. TLS ends at the Gateway; set
# config.baseURL to the https address. The Gateway's own timeouts and body limits apply to
# uploads (Traefik v3, for example, reads a request for at most 60 s by default).
httpRoute:
  enabled: false
  annotations: {}
  # The Gateway(s) to attach to. Required when enabled.
  parentRefs: []
  #  - name: traefik-gateway
  #    namespace: traefik
  hostnames: []
  #  - repo.example.com

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
# Empty with replicaCount above 1: a preferred podAntiAffinity on kubernetes.io/hostname, so a
# node failure takes one pod. Anything set here replaces it.
affinity: {}
priorityClassName: ""

# OpenShift's restricted-v2 SCC assigns the user and groups itself: set runAsUser, runAsGroup and
# fsGroup to null there (README.md).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532 # the image's nonroot user
  runAsGroup: 65532
  fsGroup: 65532 # makes the volume writable for that user
  fsGroupChangePolicy: OnRootMismatch # no recursive chown of every blob on each start
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# On SIGTERM the server turns unready (it keeps serving for 5 s more, so the endpoints drop it
# first), drains requests for up to 30 s, then writes the download counters,
# queued e-mail and activity events and closes the database. The other pods keep serving; a task
# the pod was running stops and runs again later.
terminationGracePeriodSeconds: 60

startupProbe:
  httpGet:
    path: /service/rest/v1/status
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60 # 5 minutes for a first start or a database upgrade
# 200 while the node should take requests: the database answers, the node is not shutting down,
# its schema is compatible and its lock connection and change listener are up. Keep
# it on status/writable with replicaCount above 1: the Service then drops a pod that lost the
# database or is draining while the others serve.
readinessProbe:
  httpGet:
    path: /service/rest/v1/status/writable
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
# A TCP connect, which the kernel completes even while all connection slots of the server are
# busy. An HTTP check would wait behind them and restart a pod that is only saturated.
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 30
  timeoutSeconds: 5

# More volumes, for example an NFS claim for a named blob store created in the web UI with that
# path (blobs may live on NFS). With replicaCount above 1 every pod mounts them
# at the same path, so they must be ReadWriteMany too.
extraVolumes: []
extraVolumeMounts: []
