services:
  commandcenter:
    build:
      context: .
      args:
        VERSION: ${COMMANDCENTER_VERSION:-dev}   # what `commandcenter version` and the UI report
    image: commandcenter:latest
    container_name: commandcenter
    ports: ["8081:8081"]
    volumes:
      - ./config.yaml:/etc/commandcenter/config.yaml:ro
      - data:/data
    environment:
      GOMEMLIMIT: 80MiB
      # HTTPS_PROXY: http://proxy.example.com:3128   # set if a corporate proxy is required
      # COMMANDCENTER_SECRET_KEY: ${COMMANDCENTER_SECRET_KEY:?}   # encrypts stored SMTP/LDAP/remoteAuth secrets (shell or .env); back it up apart from the volume
    mem_limit: 128m
    restart: unless-stopped
    # On SIGTERM the server drains requests for up to 30 s, then flushes metrics
    # and events. Docker's default of 10 s would SIGKILL uploads mid-drain.
    stop_grace_period: 60s

volumes:
  data:
    name: ${COMMANDCENTER_VOLUME:-commandcenter-data}
